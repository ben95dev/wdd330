<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search | ReadSpace</title>
  <meta name="description" content="Search millions of books by title, author, or keyword.">
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="search">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <div class="container">
      <div class="page-title-bar">
        <h1>Search books</h1>
        <form id="search-form" class="search-form" action="search.html" method="get" role="search">
          <label class="visually-hidden" for="q">Search books</label>
          <input id="q" type="search" name="q" placeholder="Title, author, or keyword" required>
          <button class="btn btn-cta" type="submit">Search</button>
        </form>
      </div>

      <!-- Filters arrive in Week 6 -->

      <p id="results-status" class="results-status" role="status" aria-live="polite"></p>
      <div id="results-message"></div>
      <ul id="results-grid" class="book-grid"></ul>

      <div id="load-more-wrap" class="load-more-wrap" hidden>
        <button id="load-more" class="btn btn-outline" type="button">Show more books</button>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
